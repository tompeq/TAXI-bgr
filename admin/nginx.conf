server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep MinIO private; temporary document URLs are proxied through this
    # container with the internal Host header used to create their signature.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location = /taxi-bgr-update.json {
        alias /srv/releases/taxi-bgr-update.json;
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control "no-store";
    }

    location = /taxi-bgr-remote.apk {
        alias /srv/releases/taxi-bgr-remote.apk;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="taxi-bgr.apk"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
